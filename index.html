<style>

<script>
/*ENGINE*/
const NF = new Intl.NumberFormat('en-US');
const rs = n => (n < 0 ? '-' : '') + 'Rs ' + NF.format(Math.round(Math.abs(n)));
const pc = (x, d = 0) => (x * 100).toFixed(d) + '%';
const TOL = 50000;
const confLevel = c => (c >= 0.85 ? 'hi' : c >= 0.6 ? 'mid' : 'lo');
const confWord = c => ({ hi: 'High', mid: 'Medium', lo: 'Low' })[confLevel(c)];

/* Slab rows: [from, fixed tax, rate on excess] */
const NON = [[0,0,0],[600000,0,.15],[1200000,90000,.20],[1600000,170000,.30],[3200000,650000,.40],[5600000,1610000,.45]];
const SLABS = {
  2026: {
    salaried: [[0,0,0],[600000,0,.01],[1200000,6000,.11],[2200000,116000,.23],[3200000,346000,.30],[4100000,616000,.35]],
    non: NON, surSal: 0.09, surNon: 0.09
  },
  2027: {
    salaried: [[0,0,0],[600000,0,.01],[1200000,6000,.11],[2200000,116000,.20],[3200000,316000,.25],[4100000,541000,.29],[5600000,976000,.32],[7000000,1424000,.35]],
    non: NON, surSal: 0, surNon: 0.09
  }
};

function taxOn(table, income) {
  let idx = 0;
  table.forEach((r, i) => { if (income >= r[0]) idx = i; });
  const r = table[idx];
  return { tax: r[1] + (income - r[0]) * r[2], idx, slab: r, next: table[idx + 1] ? table[idx + 1][0] : null };
}

function compute(p, ty) {
  ty = ty || p.ty;
  const T = SLABS[ty];
  const biz = Math.max(0, p.bizReceipts - p.bizExpenses);
  const total = p.salary + p.rent + biz;
  const zakat = Math.min(p.zakat, total);
  const taxable = Math.max(0, total - zakat);
  const share = taxable > 0 ? Math.min(1, p.salary / taxable) : 0;
  const salaried = taxable > 0 && share >= 0.75;
  const table = salaried ? T.salaried : T.non;
  const r = taxOn(table, taxable);
  const gross = r.tax;
  const surRate = salaried ? T.surSal : T.surNon;
  const sur = taxable > 10000000 ? gross * surRate : 0;
  const donEligible = Math.min(p.donation, 0.30 * taxable);
  const credit = taxable > 0 ? Math.round(gross * donEligible / taxable) : 0;
  const net = Math.max(0, gross + sur - credit);
  const finalTax = Math.round(0.15 * p.profitOnDebt);
  const paid = p.whtSalary + p.advance;
  const balance = net - paid;
  return { ty, biz, total, zakat, taxable, share, salaried, table, slab: r, gross, sur, surRate, donEligible, credit, net, finalTax, paid, balance,
           eff: taxable > 0 ? net / taxable : 0 };
}

function wealthCalc(p, c) {
  const sum = (k, type) => p.wealth.filter(w => w.type === type).reduce((a, w) => a + (+w[k] || 0), 0);
  const openNet = sum('open', 'asset') - sum('open', 'liab');
  const closeNet = sum('close', 'asset') - sum('close', 'liab');
  const gifts = p.gifts.reduce((a, g) => a + g.amount, 0);
  const lines = [
    ['Salary, rent and business income', c.total],
    ['Profit on bank deposits (before final tax)', p.profitOnDebt],
    ['Gifts received', gifts],
    ['Tax paid during the year (withheld + advance)', -c.paid],
    ['Final tax on bank profit', -c.finalTax],
    ['Zakat paid', -c.zakat],
    ['Donations paid', -p.donation],
    ['Personal expenses', -p.expenses]
  ];
  const expected = lines.reduce((a, l) => a + l[1], 0);
  const actual = closeNet - openNet;
  const gap = actual - expected;
  return { openNet, closeNet, gifts, lines, expected, actual, gap, ok: Math.abs(gap) <= TOL };
}

/* ---------- OCR helpers ---------- */
function ocrNum(raw) {
  let fixes = 0;
  const map = { O: '0', o: '0', S: '5', I: '1', l: '1', B: '8' };
  const s = raw.replace(/[OoSIlB]/g, m => { fixes++; return map[m]; }).replace(/[^0-9]/g, '');
  return { value: +s || 0, fixes };
}

/* ---------- transaction classifier ---------- */
const CATS = {
  salary: 'Salary', rent: 'Rent income', freelance: 'Freelance receipts', profit: 'Bank profit', zakat: 'Zakat',
  donation: 'Donation', expense: 'Personal spending', gift: 'Gift received', loan: 'Loan received', unclear: 'Needs a decision', other: 'Other'
};
function classifyTxn(desc, credit, debit) {
  const d = desc.toLowerCase();
  if (/salary|payroll|sal cr/.test(d)) return { cat: 'salary', conf: 0.97 };
  if (/rent|tenant/.test(d)) return { cat: 'rent', conf: 0.93 };
  if (/payoneer|upwork|fiverr|wise |client payout|swift/.test(d)) return { cat: 'freelance', conf: 0.9 };
  if (/profit|markup|interest/.test(d)) return { cat: 'profit', conf: 0.95 };
  if (/zakat/.test(d)) return { cat: 'zakat', conf: 0.96 };
  if (/donat|welfare|trust|charity|foundation/.test(d)) return { cat: 'donation', conf: 0.85 };
  if (/school|fees|k-electric|sui|wapda|ptcl|utility|bill|grocer|mart|fuel|pharmacy/.test(d)) return { cat: 'expense', conf: 0.9 };
  if (credit > 0 && /ibft|raast|transfer|trf|fund/.test(d)) return { cat: 'unclear', conf: 0.42 };
  return { cat: 'other', conf: 0.5 };
}

function genSampleBank() {
  const rows = [];
  const add = (date, desc, credit, debit, extra) => {
    const c = classifyTxn(desc, credit, debit);
    rows.push(Object.assign({ date, desc, credit, debit, cat: c.cat, conf: c.conf, confirmed: false }, extra || {}));
  };

function bankTotals(bank) {
  const t = {};
  Object.keys(CATS).forEach(k => (t[k] = { n: 0, credit: 0, debit: 0, conf: 0 }));
  bank.forEach(r => { const x = t[r.cat] || t.other; x.n++; x.credit += r.credit; x.debit += r.debit; x.conf += r.conf; });
  Object.values(t).forEach(x => { x.conf = x.n ? x.conf / x.n : 0; });
  return t;
}

/* ---------- CSV import (real parsing) ---------- */
function parseCSV(txt) {
  const out = [];
  txt.split(/\r?\n/).forEach(line => {
    if (!line.trim()) return;
    const cells = []; let cur = '', q = false;
    for (const ch of line) {
      if (ch === '"') q = !q;
      else if (ch === ',' && !q) { cells.push(cur.trim()); cur = ''; }
      else cur += ch;
    }
    cells.push(cur.trim());
    out.push(cells);
  });
  return out;
}
function importBank(txt) {
  const rows = parseCSV(txt);
  if (rows.length < 2) return { error: 'The file has no data rows.' };
  const head = rows[0].map(h => h.toLowerCase());
  const find = re => head.findIndex(h => re.test(h));
  const iDate = find(/date/), iDesc = find(/desc|narr|detail|particular|remark/);
  const iDeb = find(/debit|withdraw|\bdr\b/), iCred = find(/credit|deposit|\bcr\b/), iAmt = find(/^amount/);
  if (iDesc < 0 || (iDeb < 0 && iCred < 0 && iAmt < 0)) return { error: 'Could not find description and amount columns. Expected headers like Date, Description, Debit, Credit.' };
  const num = s => +(String(s || '').replace(/[^0-9.\-]/g, '')) || 0;
  const bank = rows.slice(1).map((r, i) => {
    let credit = iCred >= 0 ? num(r[iCred]) : 0, debit = iDeb >= 0 ? num(r[iDeb]) : 0;
    if (iAmt >= 0 && !credit && !debit) { const a = num(r[iAmt]); if (a >= 0) credit = a; else debit = -a; }
    const desc = r[iDesc] || '';
    const c = classifyTxn(desc, credit, debit);
    return { id: i, date: iDate >= 0 ? r[iDate] : '', desc, credit, debit, cat: c.cat, conf: c.conf, confirmed: false };
  }).filter(r => r.credit || r.debit);
  return { bank };
}

function extractDoc(S, doc) {
  return doc.fields.map(f => {
    if (f.fn) { const r = f.fn(S); return { k: f.k, label: f.label, value: r.value, conf: r.conf, fixes: 0 }; }
    const m = doc.text.match(f.re);
    if (!m) return { k: f.k, label: f.label, value: 0, conf: 0.3, fixes: 0, missing: true };
    const n = ocrNum(m[1]);
    let value = n.value;
    if (f.mult) { const mm = doc.text.match(f.mult); if (mm) value *= +mm[1]; }
    return { k: f.k, label: f.label, value, conf: Math.max(0.4, f.base - 0.06 * n.fixes), fixes: n.fixes };
  });
}
function applyDoc(S, doc) {
  const res = extractDoc(S, doc);
  res.forEach(f => { S.p[f.k] = f.value; S.meta[f.k] = { conf: f.conf, src: doc.name }; });
  S.docState[doc.id] = { status: 'done', fields: res };
  return res;
}

/* ---------- validation engine ---------- */
function runChecks(S) {
  const p = S.p, c = compute(p), w = wealthCalc(p, c), bt = bankTotals(S.bank), out = [];
  const add = (id, title, status, detail, extra) => out.push(Object.assign({ id, title, status, detail }, extra || {}));
  const near = (a, b, t) => Math.abs(a - b) <= Math.max(1, t * Math.max(a, b));
  const pending = DOCS.filter(d => S.docState[d.id].status !== 'done');
  if (pending.length) add('docs', 'Documents waiting for extraction', 'warn', `${pending.length} of ${DOCS.length} documents have not been read yet: ${pending.map(d => d.name).join(', ')}.`, { go: 'documents', conf: 1 });
  else add('docs', 'All documents read', 'pass', 'Every uploaded document has been extracted and mapped to the return.', { conf: 1 });

  const slabSal = taxOn(SLABS[p.ty].salaried, p.salary).tax;
  if (p.salary > 0) {
    if (near(slabSal, p.whtSalary, 0.01)) add('wht', 'Employer tax matches the salary slab', 'pass', `Tax deducted ${rs(p.whtSalary)} equals the salaried-slab tax on ${rs(p.salary)}.`, { conf: 0.97 });
    else add('wht', 'Employer tax differs from the salary slab', 'warn', `Expected about ${rs(slabSal)} on salary alone but the certificate shows ${rs(p.whtSalary)}.`, { conf: 0.8, ask: 'Employer tax does not match the salary slab' });
  }
  const salNet = bt.salary.credit;
  if (p.salary > 0 && bt.salary.n) {
    if (near(salNet, p.salary - p.whtSalary, 0.05)) add('salbank', 'Bank salary credits match the certificate', 'pass', `Salary credits of ${rs(salNet)} agree with gross less tax (${rs(p.salary - p.whtSalary)}).`, { conf: 0.95 });
    else add('salbank', 'Bank salary credits do not match the certificate', 'warn', `Credits ${rs(salNet)} vs ${rs(p.salary - p.whtSalary)} expected.`, { conf: 0.8, ask: 'Salary credits differ from the certificate' });
  }
  if (bt.rent.n) {
    if (near(bt.rent.credit, p.rent, 0.05)) add('rent', 'Rent in bank matches rent declared', 'pass', `Bank rent credits ${rs(bt.rent.credit)} agree with declared rent ${rs(p.rent)}.`, { conf: 0.93 });
    else add('rent', 'Rent in bank differs from rent declared', 'fail', `Bank shows ${rs(bt.rent.credit)} of rent but ${rs(p.rent)} is declared.`, { conf: 0.9, ask: 'Rent declared differs from bank credits' });
  }
  if (bt.freelance.credit > 0) {
    if (p.bizReceipts >= 0.9 * bt.freelance.credit) add('free', 'Freelance deposits are declared', 'pass', `Declared receipts ${rs(p.bizReceipts)} cover bank deposits of ${rs(bt.freelance.credit)}.`, { conf: 0.9 });
    else add('free', 'Freelance deposits not declared', 'fail', `The bank shows ${rs(bt.freelance.credit)} from freelance payers but only ${rs(p.bizReceipts)} is declared as business income.`, { conf: 0.9, go: 'documents', ask: 'Freelance deposits are not in the return' });
  }
  if (bt.zakat.debit > 0 || p.zakat > 0) {
    if (near(bt.zakat.debit, p.zakat, 0.02)) add('zakat', 'Zakat is evidenced', 'pass', `Zakat of ${rs(p.zakat)} appears in both the certificate and the bank statement.`, { conf: 0.95 });
    else add('zakat', 'Zakat amounts differ', 'warn', `Declared ${rs(p.zakat)}, bank debit ${rs(bt.zakat.debit)}.`, { conf: 0.8 });
  }
  if (p.donation > 0 || bt.donation.debit > 0) {
    if (!near(bt.donation.debit, p.donation, 0.02)) add('don', 'Donation amount differs from the bank', 'warn', `Declared ${rs(p.donation)}, bank debit ${rs(bt.donation.debit)}.`, { conf: 0.75 });
    else add('don', 'Donation credit needs donee approval', 'warn', 'The receipt does not show that the trust is an approved donee. The tax credit is allowed only for approved organisations. The prototype cannot look this up.', { conf: S.meta.donation ? S.meta.donation.conf : 0.7, ask: 'Please confirm the donee is an approved organisation' });
  }
  const unclear = S.bank.filter(r => r.cat === 'unclear' && !r.confirmed);
  unclear.forEach(r => add('unc' + r.id, 'Large credit with no clear source', 'warn', `${r.date}: ${r.desc} for ${rs(r.credit)}. Was it a gift, a loan or income? The answer changes the Wealth Statement.`, { conf: r.conf, txn: r.id, ask: 'Large transfer of ' + rs(r.credit) + ' with unknown source' }));
  if (c.taxable > 0 && c.share > 0.68 && c.share < 0.82) add('share', 'Salary share is close to the 75% line', c.salaried ? 'warn' : 'warn', `Salary is ${pc(c.share, 1)} of taxable income. At 75% or more the lower salaried slabs apply. Small changes in other income move you across the line.`, { conf: 0.9, go: 'whatif' });
  if (w.ok) add('wealth', 'Wealth Statement reconciles', 'pass', `Net worth moved by ${rs(w.actual)}. Declared money explains it within ${rs(TOL)} (difference ${rs(w.gap)}).`, { conf: 0.9 });
  else add('wealth', 'Wealth Statement does not reconcile', 'fail', `Net worth rose by ${rs(w.actual)} but declared income, gifts and spending explain ${rs(w.expected)}. Unexplained: ${rs(w.gap)}.`, { conf: 0.85, go: 'wealth', ask: 'Wealth Statement shows an unexplained difference of ' + rs(w.gap) });
  if (c.balance > 0) add('bal', 'Tax is still payable', 'warn', `After withholding and advance tax, ${rs(c.balance)} remains to be paid before filing.`, { conf: 0.9, go: 'return' });
  else add('bal', 'Withholding covers the tax', 'pass', c.balance < 0 ? `A refund of ${rs(-c.balance)} is claimable.` : 'No balance is due.', { conf: 0.9 });
  return out;
}

function readiness(S, checks) {
  const docsDone = DOCS.filter(d => S.docState[d.id].status === 'done').length;
  const lowFields = Object.keys(S.meta).filter(k => S.meta[k].conf < 0.8 && !S.meta[k].confirmed).length;
  const c = compute(S.p), w = wealthCalc(S.p, c);
  const passRatio = checks.filter(x => x.status === 'pass').length / Math.max(1, checks.length);
  const openEsc = S.esc.filter(e => e.mine && e.status === 'open').length;
  const parts = [
    { k: 'Documents read', max: 25, v: 25 * docsDone / DOCS.length, tip: 'Run extraction on the remaining documents.' },
    { k: 'Low-confidence values confirmed', max: 15, v: 15 * (1 - Math.min(1, lowFields / 3)), tip: 'Confirm or correct values marked Medium or Low.' },
    { k: 'Wealth Statement reconciled', max: 25, v: w.ok ? 25 : 25 * Math.max(0, 1 - Math.abs(w.gap) / 1000000), tip: 'Explain the unexplained difference.' },
    { k: 'Validation checks passed', max: 20, v: 20 * passRatio, tip: 'Resolve the failed and warned checks.' },
    { k: 'Professional questions answered', max: 5, v: openEsc ? 0 : 5, tip: 'Wait for the professional reply.' },
    { k: 'Taxpayer review signed off', max: 10, v: S.signoff.reviewed ? 10 : 0, tip: 'Review the return and confirm it.' }
  ];
  const score = Math.round(parts.reduce((a, x) => a + x.v, 0));
  return { score, parts };
}

/* ---------- explanations (Explain-Why engine) ---------- */
function slabText(table, idx) {
  const r = table[idx], nxt = table[idx + 1];
  return `${rs(r[0])} to ${nxt ? rs(nxt[0]) : 'no upper limit'}: ${rs(r[1])} + ${pc(r[2])} of the part above ${rs(r[0])}`;
}
function explain(key) {
  const D = derive(), c = D.c, p = S.p, w = D.w, T = SLABS[p.ty];
  let title = '', steps = [], refs = [], conf = 0.9;
  if (key === 'regime') {
    title = 'Why this slab table applies';
    const salTax = taxOn(T.salaried, c.taxable).tax, nonTax = taxOn(T.non, c.taxable).tax;
    const headroom = p.salary / 0.75 - p.salary + c.zakat - p.rent - c.biz;
    steps = [
      ['Add income by head', `Salary ${rs(p.salary)} + rent ${rs(p.rent)} + business ${rs(c.biz)} (receipts ${rs(p.bizReceipts)} less expenses ${rs(p.bizExpenses)}) = ${rs(c.total)}`],
      ['Subtract Zakat', `${rs(c.total)} - ${rs(c.zakat)} = taxable income ${rs(c.taxable)}`],
      ['Work out the salary share', `${rs(p.salary)} / ${rs(c.taxable)} = ${pc(c.share, 1)}`],
      ['Apply the 75% rule', c.salaried ? 'Share is 75% or more, so the salaried slabs apply.' : 'Share is below 75%, so the non-salaried slabs apply to all taxable income.'],
      ['See what the other table would give', `Salaried slabs: ${rs(salTax)}. Non-salaried slabs: ${rs(nonTax)}. Difference: ${rs(Math.abs(salTax - nonTax))}.`],
      ['Room before the line moves', headroom >= 0 ? `Other income can rise by ${rs(headroom)} before the share drops under 75%.` : `Other income would have to fall by ${rs(-headroom)} for the salaried slabs to apply.`]
    ];
    refs = ['Income Tax Ordinance 2001, First Schedule, Part I, Division I'];
  } else if (key === 'tax') {
    title = 'How the normal tax is calculated';
    steps = [
      ['Find the slab for taxable income', slabText(c.table, c.slab.idx)],
      ['Compute the tax', `${rs(c.slab.slab[1])} + ${pc(c.slab.slab[2])} x ${rs(c.taxable - c.slab.slab[0])} = ${rs(c.gross)}`],
      ['Surcharge', c.sur ? `Taxable income is above Rs 10,000,000, so ${pc(c.surRate)} of tax is added: ${rs(c.sur)}.` : 'No surcharge applies at this income.'],
      ['Subtract credits', `Donation credit ${rs(c.credit)}`],
      ['Net normal tax', `${rs(c.gross)} + ${rs(c.sur)} - ${rs(c.credit)} = ${rs(c.net)}`]
    ];
    refs = ['Income Tax Ordinance 2001, First Schedule, Part I, Division I', 'Rates for tax year ' + p.ty + ' as reported after the Finance Act 2026; verify on the FBR site'];
  } else if (key === 'credit') {
    title = 'How the donation credit is calculated';
    conf = S.meta.donation ? S.meta.donation.conf : 0.7;
    steps = [
      ['Donation paid', `${rs(p.donation)} (confidence ${Math.round(conf * 100)}%)`],
      ['Cap at 30% of taxable income', `30% x ${rs(c.taxable)} = ${rs(0.3 * c.taxable)}. Eligible: ${rs(c.donEligible)}.`],
      ['Credit = tax x eligible donation / taxable income', `${rs(c.gross)} x ${rs(c.donEligible)} / ${rs(c.taxable)} = ${rs(c.credit)}`],
      ['Condition', 'The receipt does not show that the trust is an approved donee. The credit is at risk until that is confirmed.']
    ];
    refs = ['Income Tax Ordinance 2001, section 61'];
  } else if (key === 'final') {
    title = 'Why bank profit is taxed separately';
    steps = [
      ['Bank profit for the year', rs(p.profitOnDebt)],
      ['Final tax at 15%', `15% x ${rs(p.profitOnDebt)} = ${rs(c.finalTax)}, already deducted by the bank`],
      ['Effect', 'This income is not added to taxable income, so it does not move your salary share or slab.']
    ];
    refs = ['Income Tax Ordinance 2001, section 7B'];
  } else if (key === 'payable') {
    title = 'How the balance is worked out';
    steps = [
      ['Normal tax for the year', rs(c.net)],
      ['Tax already paid', `Employer ${rs(p.whtSalary)} + advance ${rs(p.advance)} = ${rs(c.paid)}`],
      [c.balance > 0 ? 'Balance to pay' : 'Refund claimable', `${rs(c.net)} - ${rs(c.paid)} = ${rs(c.balance)}`],
      ['Why the employer amount can fall short', 'Your employer deducted tax on the salaried slab. Other income can move the whole return to higher slabs, so the difference falls due when you file.']
    ];
    refs = ['Income Tax Ordinance 2001, section 114'];
  } else if (key === 'gap') {
    title = 'Why the Wealth Statement does or does not reconcile';
    const last = w.lines.map(l => [l[0], rs(l[1])]);
    steps = [
      ['Net worth at start and end', `${rs(w.openNet)} to ${rs(w.closeNet)}, a change of ${rs(w.actual)}`],
      ['What your declared money explains', last.map(l => l[0] + ' ' + l[1]).join('; ')],
      ['Explained change', rs(w.expected)],
      ['Difference', `${rs(w.actual)} - ${rs(w.expected)} = ${rs(w.gap)}. Tolerance is ${rs(TOL)}.`],
      ['Common causes', w.gap > 0 ? 'Undeclared income, a gift or loan not recorded, or personal expenses entered too high.' : 'Income declared that was not received, or spending entered too low.']
    ];
    refs = ['Income Tax Ordinance 2001, section 116'];
  } else if (key === 'score') {
    title = 'How the readiness score is built';
    steps = D.rd.parts.map(x => [x.k, `${Math.round(x.v)} of ${x.max} points. ${x.v < x.max ? x.tip : 'Complete.'}`]);
  } else if (key === 'conf') {
    title = 'What the confidence indicators mean';
    conf = 1;
    steps = [
      ['High, 85% and above', 'The value was read cleanly and agrees with other documents.'],
      ['Medium, 60% to 84%', 'The reader had to repair characters (for example O read as 0) or the value is your own estimate. Confirm it.'],
      ['Low, below 60%', 'The source is unclear. The platform asks you, and can pass the item to a tax professional.'],
      ['How it is scored', 'Each field starts from the extractor\'s base score. Every repaired character removes 6 points. Bank lines are scored by how specific the description is.']
    ];
  }
  const html = `<ol>${steps.map(s => `<li><b>${s[0]}</b><div class="calc">${esc(s[1])}</div></li>`).join('')}</ol>` +
    (refs.length ? `<div class="note"><b>Basis:</b> ${refs.map(esc).join('; ')}. References are for orientation. Verify against current law before filing.</div>` : '');
  return { title, html, conf, key };
}

function setTxnCat(id, cat) {

}

function botSay(html, o) { S.chat.push(Object.assign({ role: 'bot', html }, o || {})); }
function userSay(t) { S.chat.push({ role: 'user', html: esc(t) }); }
function amounts(t) {
  const out = []; const re = /(\d[\d,]*(?:\.\d+)?)\s*(k|thousand|lakhs?|lacs?|m|mn|million|crore)?\b/gi; let m;
  while ((m = re.exec(t))) {
    let v = parseFloat(m[1].replace(/,/g, '')); const u = (m[2] || '').toLowerCase();
    if (u === 'k' || u === 'thousand') v *= 1e3; else if (/^la/.test(u)) v *= 1e5; else if (u === 'm' || u === 'mn' || u === 'million') v *= 1e6; else if (u === 'crore') v *= 1e7;
    if (v >= 1000) out.push(v);
  }
  return out;
}
const setField = (k, v, src) => { S.p[k] = v; S.meta[k] = { conf: 0.82, src }; };
function summaryLine(before, after) {
  const bits = [before.net === after.net ? `Net tax unchanged at ${rs(after.net)}` : `Net tax ${rs(before.net)} to ${rs(after.net)}`];
  if (before.salaried !== after.salaried) bits.push(`regime moved from ${before.salaried ? 'salaried' : 'non-salaried'} to ${after.salaried ? 'salaried' : 'non-salaried'} slabs`);
  return bits.join(', ');
}
function respond(text) {

  const monthly = /month|monthly|per month|pm\b|mahina/.test(t), annual = /annual|yearly|per year|a year|saal/.test(t);
  const per = (v, defMonthly) => (annual ? v : monthly || (defMonthly && v < 1500000) ? v * 12 : v);
  const unclear = S.bank.find(r => r.cat === 'unclear' && !r.confirmed);
  const done = (msg, changes) => {
    const af = compute(S.p), wa = wealthCalc(S.p, af);

  if (m) {

  }

  }
  if (/gift|gifted/.test(t) && !/gift tax/.test(t)) {

    const amt = a || (unclear && unclear.credit);

    else S.p.gifts.push({ from: who, amount: amt });

  if (/advance tax/.test(t) && a) { setField('advance', a, 'Your message'); done(`Advance tax paid set to ${rs(a)}.`, ['Advance tax ' + rs(a)]); return; }

  }
  if (/rent/.test(t) && a && /receiv|income|earn|get|tenant|collect/.test(t)) { const v = per(a, true); setField('rent', v, 'Your message'); done(`Rent income set to ${rs(v)} for the year.`, ['Rent ' + rs(v)]); return; }
  if (/freelanc|upwork|fiverr|payoneer|client/.test(t) && a) { const v = per(a, false); setField('bizReceipts', v, 'Your message'); done(`Freelance receipts set to ${rs(v)}. Business expenses stay at ${rs(S.p.bizExpenses)} until you add the expense sheet.`, ['Freelance receipts ' + rs(v)]); return; }
  if (/expens|spend|spending|kharch/.test(t) && a) { const v = per(a, true); setField('expenses', v, 'Your message'); done(`Personal expenses set to ${rs(v)} for the year. This drives the Wealth Statement check.`, ['Expenses ' + rs(v)]); return; }
  const wb2 = n => new RegExp('\\b' + n.toLowerCase().replace(/[^a-z0-9 ]/g, '') + '\\b').test(t.replace(/[^a-z0-9 ]/g, ''));
  const g = /what is|what's|what does|meaning|define|explain|kya hai/.test(t) && GLOSS.find(x => wb2(x[0]) || wb2(x[1]));
  if (g) { botSay(`<b>${esc(g[1])}.</b> ${esc(g[2])} <span class="note">${esc(g[3])}</span>`, { conf: 0.95 }); return; }

  });

    <text x="90" y="82" text-anchor="middle" style="font:700 34px var(--f-display);fill:var(--ink)">${score}</text><text x="90" y="102" text-anchor="middle">out of 100</text></svg>`;
}

/* ---------- What-if ---------- */
function wiInit() {

function scen(q, ty) {
  const x = Object.assign({}, S.p, { ty, salary: q.sal * 12, rent: q.rent * 12, bizReceipts: q.free, bizExpenses: 0, zakat: q.zak, donation: q.don, whtSalary: Math.round(taxOn(SLABS[ty].salaried, q.sal * 12).tax) });
  return compute(x, ty);
}
function curr(ty) { const x = Object.assign({}, S.p, { ty }); if (ty !== S.p.ty) x.whtSalary = Math.round(taxOn(SLABS[ty].salaried, S.p.salary).tax); return compute(x, ty); }
function curveSVG(q) {
  const W = 640, H = 250, L = 62, R = 16, Tp = 14, B = 34, MAX = 1500000;
  const xs = []; for (let x = 0; x <= MAX; x += 25000) xs.push(x);
  const ys = xs.map(x => scen(Object.assign({}, q, { free: x }), 2026).net);
  const ymax = Math.max.apply(null, ys) * 1.1 || 1;
  const X = v => L + v / MAX * (W - L - R), Y = v => H - B - v / ymax * (H - B - Tp);
  const path = xs.map((x, i) => (i ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(ys[i]).toFixed(1)).join(' ');
  const cliff = q.sal * 12 / 0.75 - q.sal * 12 - q.rent * 12 + q.zak;
  const grid = [0, .25, .5, .75, 1].map(f => { const v = ymax * f / 1.1; return `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${(v / 1e6).toFixed(2)}M</text>`; }).join('');
  const xt = [0, 500000, 1000000, 1500000].map(v => `<text x="${X(v)}" y="${H - 12}" text-anchor="${v === 0 ? 'start' : v === MAX ? 'end' : 'middle'}">${v / 1e6}M</text>`).join('');
  const cur = scen(q, 2026).net;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Normal tax against freelance net income, with the 75% salary line">${grid}${xt}
    ${cliff > 0 && cliff < MAX ? `<line x1="${X(cliff)}" x2="${X(cliff)}" y1="${Tp}" y2="${H - B}" stroke="var(--gold)" stroke-width="2" stroke-dasharray="5 4"/><text x="${X(cliff) + 6}" y="${Tp + 12}" style="fill:var(--gold)">75% line at ${rs(cliff)}</text>` : ''}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5"/><circle cx="${X(q.free)}" cy="${Y(cur)}" r="6" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${W / 2}" y="${H - 1}" text-anchor="middle">Freelance net income for the year (tax year 2026 slabs)</text></svg>`;
}

function replayForm() {
  const D = derive(), n = formFields(D).reduce((a, s) => a + s.f.filter(f => f.v != null).length, 0);
  S.formSeen = new Set(); S.formReveal = 0; S.formStarted = true;
  const step = () => {
    if (S.view !== 'form') { S.formReveal = null; return; }
    S.formReveal++;
    if (S.formReveal >= n) { S.formReveal = null; render(); return; }
    render(); setTimeout(step, 90);
  };
  render(); setTimeout(step, 90);
}
function viewForm(D) {
  if (!S.formSeen) S.formSeen = new Set();
  if (!S.formStarted) { S.formStarted = true; S.formReveal = 0; setTimeout(() => { S.formSeen = new Set(); const n = formFields(derive()).reduce((a, s) => a + s.f.filter(f => f.v != null).length, 0); const step = () => { if (S.view !== 'form') { S.formReveal = null; return; } S.formReveal++; if (S.formReveal >= n) { S.formReveal = null; render(); return; } render(); setTimeout(step, 90); }; step(); }, 250); }
  const secs = formFields(D);
  let order = 0, total = 0, shown = 0; S._ps = [];
  const pendingDocs = DOCS.filter(d => S.docState[d.id].status !== 'done');
  const body = secs.map(s => `<section class="fsec" aria-labelledby="fs-${s.t}"><h2 id="fs-${s.t}"><span class="ft">${s.t}</span>${s.h}</h2><div class="fgrid">${s.f.map(f => {
    total++;
    const has = f.v != null, idx = has ? order++ : -1, vis = has && (S.formReveal == null || idx < S.formReveal);
    if (vis) shown++;
    const flash = vis && !S.formSeen.has(f.id); if (flash) S._ps.push(f.id);
    return `<div class="ff ${vis ? '' : 'empty'} ${flash ? 'flash' : ''}"><label for="f-${f.id}">${f.l}</label>
      <input id="f-${f.id}" readonly value="${vis ? esc(f.v) : ''}" placeholder="${has && S.formReveal != null ? 'Filling' : 'Waiting for data'}">

  }).join('')}</div></section>`).join('');
  const pct = Math.round(shown / total * 100);
  return `${vhead('Return form preview', 'Upload documents and talk to the assistant. Every value is categorized and written into the matching field below by the platform, with its source and confidence.')}

    ${nav.map(([k, l], i) => `<button class="nav" data-act="nav" data-v="${k}" ${S.view === k ? 'aria-current="page"' : ''} aria-keyshortcuts="Alt+${i + 1}"><span>${l}</span>${bd[k] ? `<span class="badge">${bd[k]}</span>` : ''}</button>`).join('')}
    <div class="sep"></div><div class="a11y" style="display:flex;flex-direction:column;gap:6px">${tog('text', 'Larger text', S.a11y.text === 'lg')}${tog('contrast', 'High contrast', S.a11y.contrast === 'high')}${tog('read', 'Read replies aloud', !!S.autoRead)}</div></nav>
    <div class="main"><header class="top"><div class="seg" role="group" aria-label="Who is using this"><button data-act="role" data-v="taxpayer" aria-pressed="${S.role === 'taxpayer'}">Taxpayer</button><button data-act="role" data-v="pro" aria-pressed="${S.role === 'pro'}">Tax professional</button></div>
      <div class="seg" role="group" aria-label="Tax year"><button data-act="ty" data-v="2026" aria-pressed="${S.p.ty === 2026}">Tax year 2026</button><button data-act="ty" data-v="2027" aria-pressed="${S.p.ty === 2027}">Tax year 2027</button></div><div class="grow"></div>
      <div class="metric"><small>${c.balance >= 0 ? 'Payable' : 'Refund'}</small><b>${rs(Math.abs(c.balance))}</b></div>
      <div class="metric"><small>Slabs</small><b>${c.salaried ? 'Salaried' : 'Non-salaried'}</b></div>
      <div class="metric"><small>Readiness</small><b>${D.rd.score}/100</b></div></header>
      <main class="view" id="view">${view}</main></div></div>${dr}`;
}
function render() {
  const D = derive(), root = document.documentElement;
  root.dataset.text = S.a11y.text; root.dataset.contrast = S.a11y.contrast;
  const V = { assistant: viewAssistant, documents: viewDocuments, return: viewReturn, form: viewForm, wealth: viewWealth, checks: viewChecks, readiness: viewReadiness, whatif: viewWhatIf, review: viewReview, glossary: viewGlossary, clients: viewClients, queue: viewQueue, copilot: viewCopilot };
  $('#app').innerHTML = shell(D, V[S.view](D));
  (S._ps || []).forEach(i => S.formSeen && S.formSeen.add(i)); S._ps = [];
  const m = $('#msgs'); if (m) m.scrollTop = m.scrollHeight;
  if (S.drawer) { const b = $('#drawerClose'); if (b) b.focus(); }
}

/* ---------- voice ---------- */
function speak(t) {
  try { const u = new SpeechSynthesisUtterance(String(t)); window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); }
  catch (e) { toast('Read aloud is not available in this browser.'); }
}
function listen() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Voice input is not supported here. Type your message.'); return; }
  try {
    const r = new SR(); r.lang = 'en-PK';
    r.onresult = e => { const el = $('#chatIn'); if (el) el.value = e.results[0][0].transcript; submitText(e.results[0][0].transcript); };
    r.onerror = e => toast(e.error === 'not-allowed' ? 'Microphone access is blocked in this preview. Type instead. Read aloud still works.' : 'Voice input failed. Type your message.');
    r.start(); toast('Listening');
  } catch (e) { toast('Voice input is not available. Type your message.'); }
}
function submitText(t) {
  t = String(t || '').trim(); if (!t) return;
  userSay(t); respond(t); render();
  const el = $('#chatIn'); if (el) el.focus();
  if (S.autoRead) { const last = S.chat[S.chat.length - 1]; if (last && last.role === 'bot') speak(strip(last.html)); }
}

/* ---------- events ---------- */
function onFile(f) {
  const clear = () => { S.p.gifts = S.p.gifts.filter(g => g.txn == null); S.p.wealth = S.p.wealth.filter(x => x.txn == null); };
  if (/\.(csv|txt)$/i.test(f.name)) {
    const rd = new FileReader();
    rd.onload = () => { const r = importBank(String(rd.result)); if (r.error) S.bankMsg = r.error; else { S.bank = r.bank; clear(); applyDoc(S, DOCS[1]); S.bankMsg = `Loaded ${r.bank.length} transactions from ${f.name}.`; } render(); };
    rd.readAsText(f);
  } else { S.bankMsg = `${f.name} was added to this session. This preview cannot run OCR on new files. The six sample documents show the full pipeline.`; render(); }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  const A = {
    nav: () => go(v), go: () => go(v),
    role: () => { S.role = v; S.view = v === 'taxpayer' ? 'assistant' : 'clients'; S.drawer = null; render(); },
    ty: () => { S.p.ty = +v; render(); },
    say: () => submitText(v),
    mic: listen,
    speak: () => speak(strip(S.chat[+el.dataset.i].html)),
    explain: () => { S.drawer = explain(v); render(); },
    closedrawer: () => { S.drawer = null; render(); },
    speakdrawer: () => speak(S.drawer.title + '. ' + strip(S.drawer.html)),
    confirm: () => { const m = S.meta[v]; m.conf = 0.98; m.confirmed = true; m.src += ' (confirmed)'; render(); },
    extract: () => runExtraction(v),
    resetbank: () => { S.bank = genSampleBank(); S.bankMsg = ''; S.p.gifts = S.p.gifts.filter(g => g.txn == null); S.p.wealth = S.p.wealth.filter(x => x.txn == null); applyDoc(S, DOCS[1]); render(); },
    txn: () => { setTxnCat(+id, v); botSay(`Recorded the transfer as a ${v}. The Wealth Statement difference is now ${rs(wealthCalc(S.p, compute(S.p)).gap)}.`, { conf: 1 }); render(); },
    ask: () => { if (escalate(v)) { botSay('Sent to a tax professional: ' + esc(v) + '. You can follow the reply under Review and export.', { conf: 1 }); } S.drawer = null; render(); },
    signoff: () => { S.signoff.reviewed = !S.signoff.reviewed; render(); },
    copysum: () => copyText(returnText(derive()), 'Summary copied.'),
    copyjson: () => { const D = derive(); copyText(JSON.stringify({ taxYear: D.c.ty, profile: S.p, computation: { totalIncome: D.c.total, taxable: D.c.taxable, regime: D.c.salaried ? 'salaried' : 'non-salaried', normalTax: D.c.net, taxPaid: D.c.paid, balance: D.c.balance, finalTax: D.c.finalTax }, wealth: { opening: D.w.openNet, closing: D.w.closeNet, difference: D.w.gap } }, null, 2), 'JSON copied.'); },
    wireset: () => { wiInit(); render(); },
    a11y: () => { if (v === 'text') S.a11y.text = S.a11y.text === 'lg' ? 'normal' : 'lg'; else if (v === 'contrast') S.a11y.contrast = S.a11y.contrast === 'high' ? 'normal' : 'high'; else S.autoRead = !S.autoRead; try { localStorage.setItem('taxproto-a11y', JSON.stringify({ a: S.a11y, r: !!S.autoRead })); } catch (x) { } render(); },
    prosel: () => { S.proSel = v; render(); },
    draftnote: () => { const D = derive(); const f = D.checks.filter(x => x.status !== 'pass').slice(0, 3); $('#noteBox').value = 'Dear Zara,\n\nYour return is ' + D.rd.score + '/100 ready. Before filing, please:\n' + (f.length ? f.map((x, i) => (i + 1) + '. ' + x.title + '. ' + x.detail).join('\n') : '1. Nothing outstanding.') + '\n\nRegards'; },
    draft: () => { const en = S.esc.find(x => x.id === id); $('#rep-' + id).value = draftReply(en); },
    reply: () => { const en = S.esc.find(x => x.id === id), box = $('#rep-' + id); if (!box.value.trim()) { toast('Write a reply first, or use AI draft reply.'); return; } en.thread.push({ who: 'Tax professional', t: box.value.trim() }); en.status = 'answered'; render(); toast('Reply sent.'); },
    replayform: replayForm,
    copyform: () => { const o = {}; formFields(derive()).forEach(s => s.f.forEach(f => { if (f.v != null) o[s.t + '.' + f.id] = { label: f.l, value: f.v, source: f.src }; })); copyText(JSON.stringify(o, null, 2), 'Field map copied.'); },
    cop: () => { askCopilot(v); render(); }
  };
  if (A[a]) A[a]();
});
document.addEventListener('change', e => {
  const el = e.target, k = el.dataset && el.dataset.chg;
  if (k === 'txn') { setTxnCat(+el.dataset.id, el.value); render(); }
  else if (k === 'wealth') { S.p.wealth[+el.dataset.i][el.dataset.f] = +el.value || 0; render(); }
  else if (k === 'expenses') { S.p.expenses = +el.value || 0; S.meta.expenses = { conf: 0.9, src: 'Your entry' }; render(); }
  else if (el.id === 'csvIn' && el.files[0]) onFile(el.files[0]);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.wi) { S.wi[el.dataset.wi] = +el.value; const lab = $('#wv-' + el.dataset.wi); if (lab) lab.textContent = rs(+el.value); $('#wiOut').innerHTML = wiHTML(); }
  else if (el.id === 'glQ') { S.glossQ = el.value; $('#glList').innerHTML = glossHTML(el.value); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'chatForm') { const el = $('#chatIn'); const t = el.value; el.value = ''; submitText(t); }
  else if (e.target.id === 'copForm') { const t = $('#copIn').value.trim(); if (t) { askCopilot(t); render(); } }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.drawer) { S.drawer = null; render(); return; }
  const nav = S.role === 'taxpayer' ? NAV_T : NAV_P;
  if (e.altKey && /^[1-9]$/.test(e.key) && nav[+e.key - 1]) { e.preventDefault(); go(nav[+e.key - 1][0]); return; }
  if (e.key === '/' && S.view === 'assistant' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); const el = $('#chatIn'); if (el) el.focus(); }
});

/* ---------- start ---------- */
try { const a = JSON.parse(localStorage.getItem('taxproto-a11y') || 'null'); if (a) { S.a11y = a.a || S.a11y; S.autoRead = !!a.r; } } catch (x) { }
seedPro();
botSay('Hello Zara. I have read 4 of your 6 documents for tax year 2026 and filled in your return. Two are still waiting: the freelance earnings sheet and the donation receipt. Open Documents to run them, or just tell me about your finances.', { conf: 0.95 });
const u0 = S.bank.find(r => r.cat === 'unclear');
botSay(`One more thing. On ${fmtDate(u0.date)} ${rs(u0.credit)} arrived from "M KHAN". I cannot tell whether it was a gift, a loan or income, and the answer changes your Wealth Statement. Which was it?`, { conf: u0.conf });
render();
/*END UI4*/
</script>

</body></html>
